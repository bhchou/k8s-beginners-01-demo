apiVersion: v1
kind: Pod

metadata:
  name: python-demo
  namespace: k8s-demo
  labels:
    app: python-demo

spec:
  containers:
    - name: python-demo
      image: docker.io/bhchoudev/python-demo-k8s-beginners-01:v1
      ports:
        - containerPort: 8080
      env:
        - name: APP_VERSION
          value: "1.0"
